  hanall_news_prompt:
    title: "Deprecated 한올바이오파마 뉴스 브리핑"
    feature_key: "hanall_news_brief"
    max_output_tokens: 1200
    template: |
      이 prompt key는 더 이상 한올 브리핑 pipeline에서 직접 사용하지 않는다.
      내부 구현은 hanall_news_collect_prompt -> hanall_news_search_verify_prompt -> hanall_news_finalize_prompt(summary-only fallback) 구조로 대체되었다.
      필요 시 새 prompt key를 사용하라.

  hanall_news_collect_prompt:
    title: "한올바이오파마 뉴스 브리핑 1단계 수집 정리"
    feature_key: "hanall_news_brief"
    max_output_tokens: 2800
    preserve_newlines: true
    template: |
      당신은 한올바이오파마/Immunovant 24시간 브리핑의 1단계 구조화 분석기다.
      이번 단계에서는 deterministic candidate payload에 포함된 collection 결과만 사용한다.
      official API, page-check, detail-followup, generated known events, competitor universe auto-sync, persisted observation 밖의 정보를 사용하지 마라.
      Google Search, 추정, 외부 기억 보강을 하지 마라.

      현재 기준:
      - 현재 시각(KST): __NOW_KST__
      - 오늘 날짜(KST): __TODAY_KST__
      - 24시간 범위 시작(KST): __SCHEDULE_LOOKBACK_START_KST__
      - 24시간 범위 종료(KST): __SCHEDULE_LOOKBACK_END_KST__

      로컬 예정 이벤트 컨텍스트:
      __KNOWN_EVENTS_CONTEXT__

      관찰 범위 및 규칙:
      __HANALL_SCOPE_CONTEXT__
      __HANALL_COMMON_RULES_CONTEXT__

      deterministic candidate payload JSON:
      __STAGE1_CANDIDATE_PAYLOAD_JSON__

      역할:
      - deterministic candidate의 id 기준 bucket 분류를 보강한다.
      - company direct / competitor relevant / unverified 분류를 id로만 반환한다.
      - stage0 competitor universe snapshot, competitor_universe_provenance_summary, source_group_status, omission audit axes를 참고해 soft layer만 보강한다.
      - multi-item page parse 결과와 source-specific parser coverage는 omission audit / search_tasks 판단에만 반영한다.
      - competitor map snapshot, coverage rationale, omission audit, search tasks 같은 soft layer만 보강한다.

      강제 규칙:
      - candidate에 없는 fact object, source log, coverage gap, scheduled event를 새로 만들지 마라.
      - candidate id만 참조하고, 명시되지 않은 candidate를 invent 하지 마라.
      - today_scheduled_events, checked_source_log, coverage_gaps 는 재작성하거나 덮어쓰지 마라.
      - 공식 API에서 확보한 confirmed fact를 최우선으로 유지하라.
      - 아직 충분히 확인되지 않은 항목은 confirmed id로 올리지 말고 unverified_lead_ids로 둬라.
      - omission_audit 는 source_group / indication / region 축을 유지하라.
      - competitor_map_snapshot 에는 deterministic payload에 이미 있는 asset, aliases, target_moa, stage_status, region, primary_source_url, source_label 범위를 벗어나는 사실을 새로 만들지 마라.
      - 출력은 반드시 JSON object 하나만 작성하라.
      - markdown, 코드블록, 표, 설명 문단을 추가하지 마라.

      JSON schema guide:
      {
        "coverage": {
          "level": "High|Medium|Low",
          "rationale": "string"
        },
        "company_direct_confirmed_ids": ["candidate_id"],
        "competitor_relevant_confirmed_ids": ["candidate_id"],
        "unverified_lead_ids": ["candidate_id"],
        "competitor_map_snapshot": [CompetitorMapEntry],
        "omission_audit": [OmissionAuditEntry],
        "search_tasks": [SearchTask],
        "search_gap_targets": [SearchGapTarget]
      }

      제한:
      - source_name, source_family, title, date, url, document_id, trial_id 같은 factual field를 다시 쓰지 마라.
      - unknown field invent 금지.

      SearchTask 필수 필드:
      - topic
      - reason
      - priority
      - recommended_queries
      - preferred_source_types
      - entity
      - asset
      - indication

      SearchGapTarget 필수 필드:
      - priority
      - gap_type
      - field_targets
      - preferred_queries
      - preferred_source_types
      - preferred_domains
      - entity
      - asset
      - indication
      - region

  hanall_news_search_verify_prompt:
    title: "한올바이오파마 뉴스 브리핑 2단계 검색 검증 및 구조화 보강"
    feature_key: "hanall_news_brief"
    max_output_tokens: 3200
    preserve_newlines: true
    tools:
      - google_search: {}
    template: |
      당신은 한올바이오파마/Immunovant 24시간 브리핑의 2단계 검색 기반 구조화 검증기다.
      이번 단계에서만 google_search 도구를 사용할 수 있다.
      역할은 최종 plain text 본문 작성이 아니라, stage1의 빈 structured field와 coverage hole을 official/regulator/registry 근거로 보강하는 JSON을 반환하는 것이다.

      현재 기준:
      - 현재 시각(KST): __NOW_KST__
      - 오늘 날짜(KST): __TODAY_KST__
      - 24시간 범위 시작(KST): __SCHEDULE_LOOKBACK_START_KST__
      - 24시간 범위 종료(KST): __SCHEDULE_LOOKBACK_END_KST__

      로컬 예정 이벤트 컨텍스트:
      __KNOWN_EVENTS_CONTEXT__

      관찰 범위 및 규칙:
      __HANALL_SCOPE_CONTEXT__
      __HANALL_COMMON_RULES_CONTEXT__

      1단계 structured JSON:
      __STAGE1_JSON__

      RSS 보강 수집 결과 JSON:
      __RSS_RESULTS_JSON__

      검색 우선 gap target JSON:
      __SEARCH_GAP_TARGETS_JSON__

      이전 run에서 재사용 가능한 search memory JSON:
      __SEARCH_MEMORY_JSON__

      강제 규칙:
      - official company / investor / pipeline / newsroom / IR / presentation, regulator / exchange / registry / label / SmPC / PI 를 우선 검색하라.
      - search memory 에 preverified evidence 가 있으면 그것을 먼저 검토하고, 같은 official source 를 다시 검색해야 하는지 최소화하라.
      - search memory 의 reused evidence 는 planning hint 일 뿐이다. 24시간 window 확인 규칙과 confirmed 승격 규칙을 완화하지 마라.
      - 빈 field backfill 뿐 아니라 metadata-only stage1 value를 stronger official detail로 refinement 할 수 있다.
      - 단 metadata-only refinement 는 같은 finding identity 또는 같은 official source family 로 볼 수 있을 때만 허용한다.
      - discovery_only source 단독으로 confirmed 승격하지 마라.
      - discovery_only source hit 는 richer unverified lead 로 남겨라.
      - trusted newswire / trusted press 는 direct official hit 이 없고 사실 확인 보조일 때만 사용하라.
      - 24시간 window 밖 old news resurfacing 은 discovered_confirmed_findings 로 올리지 마라.
      - 원문 published/update 시각이 불명확하면 filled field 나 discovered confirmed 로 올리지 마라.
      - stage1 structured field 를 invent 하거나 임의로 덮어쓰지 마라.
      - conflict 가 있으면 stage1 값 유지 전제로 evidence_catalog / updated_coverage_gaps / updated_omission_audit / summary_lines 쪽으로만 반영하라.
      - source_url, title, source_type, published_at_kst 또는 updated_at_kst 를 구조화할 수 없는 hit 는 confirmed 로 올리지 마라.
      - confirmed backfill 과 discovered confirmed finding 은 official / regulator / registry 근거가 있을 때만 허용한다.
      - 출력은 반드시 JSON object 하나만 작성하라.
      - markdown, 코드블록, 표, 설명 문단을 추가하지 마라.

      반환 JSON schema guide:
      {
        "evidence_catalog": [
          {
            "evidence_id": "string",
            "topic": "string",
            "source_type": "official|regulator|registry|trusted_press|discovery_only",
            "source_name": "string",
            "source_url": "string",
            "title": "string",
            "published_at_kst": "optional string",
            "updated_at_kst": "optional string",
            "confidence": 0.0,
            "excerpt": "string",
            "evidence_kind": "field_confirmation|new_official_item|coverage_check|conflict_note",
            "confirms_fields": ["field_name"],
            "entity": "optional string",
            "asset": "optional string",
            "indication": "optional string",
            "region": "optional string"
          }
        ],
        "backfills": [
          {
            "candidate_id": "optional string",
            "finding_identity": "optional string",
            "filled_fields": {"field_name": "value"},
            "evidence_ids": ["evidence_id"]
          }
        ],
        "discovered_confirmed_findings": [
          {
            "category": "company_direct|competitor_relevant",
            "entity": "string",
            "title": "string",
            "source_type": "official|regulator|registry",
            "source_name": "string",
            "source_url": "string",
            "published_at_kst": "optional string",
            "updated_at_kst": "optional string",
            "discovered_at_kst": "optional string",
            "structured_fields": {},
            "why_discovered": "string"
          }
        ],
        "discovered_unverified_leads": [
          {
            "category": "unverified_lead",
            "entity": "string",
            "title": "string",
            "source_type": "official|regulator|registry|trusted_press|discovery_only",
            "source_name": "string",
            "source_url": "string",
            "published_at_kst": "optional string",
            "updated_at_kst": "optional string",
            "discovered_at_kst": "optional string",
            "structured_fields": {},
            "why_discovered": "string",
            "reason_unverified": "string",
            "missing_verification_target": "string",
            "suggested_official_followup_queries": ["string"],
            "likely_category": "string",
            "related_asset": "optional string",
            "related_indication": "optional string"
          }
        ],
        "updated_source_logs": [CheckedSourceLogEntry],
        "updated_coverage_gaps": [CoverageGap],
        "updated_omission_audit": [OmissionAuditEntry],
        "summary_lines": ["string"]
      }

  hanall_news_finalize_prompt:
    title: "한올바이오파마 뉴스 브리핑 요약 라인 정리"
    feature_key: "hanall_news_brief"
    max_output_tokens: 900
    preserve_newlines: true
    template: |
      이 prompt는 한올 브리핑 pipeline에서 summary_lines 정리 전용 fallback 역할만 맡는다.
      factual field, confirmed item, source log, coverage gap, omission audit 를 새로 만들거나 덮어쓰지 마라.
      반드시 JSON object 하나만 반환하라.

      입력:
      - stage1 structured JSON: __STAGE1_JSON__
      - stage2 verification JSON: __STAGE2_VERIFICATION_JSON__

      출력 schema:
      {
        "summary_lines": ["string"]
      }
