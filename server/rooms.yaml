# rooms.yaml 설명
# - admin_room_key: 오류 알림이나 운영 메시지를 기본으로 보낼 관리자 room_key
# - defaults.delivery: 각 방의 delivery 기본값
#   - notify_admin_on_error: 기능 실패 시 관리자방 알림 여부
#   - admin_alert_throttle_seconds: 같은 종류의 관리자 알림 최소 간격(초)
#   - message_length_limit: 방으로 보낼 메시지 최대 길이
#   - dedupe_ttl_seconds: 동일 메시지 중복 적재 방지 유지 시간(초)
# - scheduled_jobs: 스케줄러에서 사용할 공통 작업 정의(선택)
#   - builder: 실행할 서버측 브리핑/생성 함수 이름
# - rooms: 방별 설정
#   - room_key: 내부 식별자. 중복되면 안 됨
#   - display_name: 카카오톡 방 이름
#   - channel_id: 메신저봇R이 감지한 실제 채널 ID. 가능하면 이름보다 이 값을 우선 사용
#   - features.youtube_summary: 유튜브 링크 수신 시 요약 활성화
#   - features.news_brief: 뉴스 브리핑 기능 활성화
#   - features.morning_brief: 아침 브리핑 기능 활성화
#   - features.weather_brief: 날씨 정보 포함 여부
#   - features.child_age: 아이 개월수/일수 정보 포함 여부
#   - schedules.enabled: 이 방에서 스케줄 작업 실행 여부
#   - schedules.jobs: 이 방의 스케줄 작업 목록
#     - name: 작업 이름
#     - builder: 실행할 서버측 함수 이름 override. 없으면 scheduled_jobs 또는 name 사용
#     - triggers: 이 방 전용 실행 시각 목록. hour/minute/day_of_week/id_suffix 사용 가능
#   - delivery.admin_room_key: 이 방 오류를 전달할 관리자 room_key override
#   - weather: 날씨 브리핑용 지역 설정
#   - child: 가족 브리핑용 생년월일 설정
#   - news.prompt_key: 뉴스 브리핑 생성에 사용할 프롬프트 키
#   - news.max_items: 뉴스 항목 최대 개수 의도값. 현재는 config로 읽기만 하고 실제 렌더링 제한에는 아직 직접 연결되지 않음
admin_room_key: admin_test_room

defaults:
  delivery:
    notify_admin_on_error: true
    admin_alert_throttle_seconds: 300
    message_length_limit: 3000
    dedupe_ttl_seconds: 600

scheduled_jobs:
  family_morning_brief:
    builder: family_morning_brief

  hanall_news_brief:
    builder: hanall_news_brief

  test_prompt:
    builder: test_prompt

rooms:
  # 현재 실제로 확인된 관리자/테스트용 방
  admin_test_room:
    display_name: "김휘태"
    channel_id: "464174551530382"
    features:
      youtube_summary: true
      news_brief: true
      morning_brief: true
      weather_brief: true
      child_age: true
    schedules:
      enabled: true
      jobs:
        - name: family_morning_brief
          triggers:
            - hour: 8
              minute: 10
        - name: hanall_news_brief
          triggers:
            - id_suffix: morning
              day_of_week: "mon-fri"
              hour: 8
              minute: 15
    delivery:
      admin_room_key: admin_test_room
      notify_admin_on_error: true
    weather:
      enabled: true
      label: "김해율하"
      grid_x: 93
      grid_y: 75
    child:
      enabled: true
      birth_date: "2024-09-26"
      include_days: true

  # 방 1: 한올바이오파마 주식 관련 카카오 오픈채팅방
